<VirtualHost *:80>
    DocumentRoot /var/www/maintenance

    ErrorDocument 503 /index.html

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/index\.html$
    RewriteRule ^ - [R=503,L]

    <Directory "/var/www/maintenance">
        Options -Indexes
        AllowOverride None
        Order allow,deny
        Allow from all
    </Directory>
</VirtualHost>
