<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>503 Service Unavailable</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #080808; font-family: Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif; }
    main { max-width: 850px; margin: 0 auto; padding: 145px 24px 100px; text-align: center; }
    h1 { font-size: clamp(32px, 6.8vw, 64px); font-weight: 400; margin: 0 0 55px; white-space: nowrap; letter-spacing: -1.5px; }
    .notice { font-size: clamp(16px, 3.65vw, 30px); line-height: 1.55; }
    .important { color: #ed0000; font-weight: 700; white-space: nowrap; }
    .explanation { margin-top: 36px; }
    .apology { margin-top: 75px; }
    p { margin: 0; }
    @media (max-width: 600px) {
      main { padding: 115px 15px 80px; }
        h1 { margin-bottom: 42px; }
      .notice { font-size: clamp(15px, 3.8vw, 22px); }
      .period { margin-top: 25px; }
      .explanation { margin-top: 28px; }
      .apology { margin-top: 62px; }
    }
    @media (max-width: 380px) { .notice { font-size: 14px; } .important { white-space: normal; } }
  </style>
</head>
<body>
  <main>
    <h1>503 Service Unavailable</h1>
    <div class="notice">
      <p class="important">【重要】緊急システムメンテナンスのお知らせ</p>
      <p>ただいま、システム基盤の緊急セキュリティ対策のため、<br>一時的に全サービスを停止しております。</p>
      <div class="explanation">
        <p>本対応は、お客様のデータを安全に保護するための予防的メンテナンスとなります。</p>
        <p>（※外部からの不正アクセスや情報漏洩等による停止ではございません）</p>
      </div>
      <div class="apology">
        <p>ご利用中の皆様には大変ご迷惑をおかけいたしますが、<br>サービスの安全な提供のため、何卒ご理解賜りますようお願い申し上げます。</p>
      </div>
    </div>
  </main>
</body>
</html>
